name: solnexus
version: "1.0.0"
config-version: 2
profile: solnexus

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: target
clean-targets: ["target", "dbt_packages"]

# dbt owns only silver. bronze and app are Alembic-owned sources (models/sources.yml).
models:
  solnexus:
    silver:
      +schema: silver
      +materialized: table
