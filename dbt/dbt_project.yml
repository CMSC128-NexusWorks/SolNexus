name: solnexus
version: "1.0.0"
config-version: 2
# Fail fast on an older dbt: silver.yml uses the generic-test "arguments:" block (dbt >= 1.10).
require-dbt-version: [">=1.12.0", "<2.0.0"]
profile: solnexus

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: target
clean-targets: ["target", "dbt_packages"]

# dbt owns only silver. bronze and app are Alembic-owned sources (models/sources.yml).
models:
  solnexus:
    # Staging is inlined into silver as CTEs (ephemeral), so dbt creates no objects outside silver.
    staging:
      +materialized: ephemeral
    silver:
      # Airflow builds into a staging schema (--vars '{silver_schema: silver_build}') and swaps it in
      # only after every model and test passed, so a failed build never replaces the live silver data.
      # A plain `dbt build` still targets silver directly, for local development.
      +schema: "{{ var('silver_schema', 'silver') }}"
      +materialized: table
