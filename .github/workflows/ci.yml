# Automated checks for every pull request into main (SNX-64, hardened in SNX-65; NFR-06).
#
# Three independent jobs run in parallel. Their `name:` values ("Frontend", "Backend", "Airflow") are
# what the main branch protection lists as required status checks, so renaming a job here means
# updating the protection rule too.
#
# Ground rules:
# - No repository secrets. Everything below uses synthetic data, mocks, or throwaway CI-only values
#   (the Postgres password exists only inside the job's own service container).
# - Runtime versions match the Dockerfiles (node:22, python:3.12, apache/airflow:2.10.5-python3.12
#   and postgres:16 from compose.yaml), so CI and local Docker Compose agree.
# - dbt build/test is deliberately not run here: it needs a Postgres seeded with synthetic bronze
#   fixtures and is tracked as a follow-up ticket.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token: these jobs only check code out and never write to the repository.
permissions:
  contents: read

# A newer push to the same PR cancels that PR's older, now-stale run. The key is the PR number, not
# the branch name: two PRs can share a branch name (e.g. from forks), and keying on head_ref let them
# cancel each other's runs. Runs on main have no PR number, so they are grouped by commit SHA and never
# cancelled, and every merge to main keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22" # frontend/Dockerfile uses node:22-alpine
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs exactly what package-lock.json says and fails if it is out of sync with
      # package.json, which is the reproducibility guarantee we want in CI.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      # Typecheck, lint and vitest can all pass while the production bundle still fails (an unresolved
      # asset import, a Tailwind/plugin error or bad Vite config), so build it too. Output is discarded.
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    # The API tests need a real PostgreSQL: backend/tests/conftest.py creates a "<db>_test" database
    # on the server named by DATABASE_URL and migrates it to head with Alembic. Same major version
    # as the Compose postgres service.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: solnexus
          POSTGRES_PASSWORD: ci-only-password # lives only in this job's throwaway container
          POSTGRES_DB: solnexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solnexus -d solnexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The test fixtures derive "solnexus_test" from this URL, so tests never touch "solnexus".
      DATABASE_URL: postgresql://solnexus:ci-only-password@localhost:5432/solnexus
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12" # backend/Dockerfile uses python:3.12-slim
          cache: pip
          # requirements-dev.txt pulls in requirements.txt, so both files key the cache.
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - run: python -m pip install -r requirements-dev.txt
      # `python -m pytest` (not bare `pytest`) puts the project root on sys.path, matching pytest.ini.
      - run: python -m pytest

  airflow:
    name: Airflow
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # The Postgres-backed tests (replay protection, quarantine savepoints, cursor-after-store, silver
    # publish) need a throwaway database migrated to head. The fixture in airflow/tests/conftest.py only
    # accepts names ending in "_ingest_test", because those tests leave append-only rows behind. A fresh
    # container per run makes that harmless here.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: solnexus
          POSTGRES_PASSWORD: ci-only-password # lives only in this job's throwaway container
          POSTGRES_DB: solnexus_ingest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solnexus -d solnexus_ingest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INGEST_TEST_DATABASE_URL: postgresql://solnexus:ci-only-password@localhost:5432/solnexus_ingest_test
    steps:
      - uses: actions/checkout@v5

      # The schema these tests write to is owned by the backend's Alembic migrations, so apply them
      # the same way airflow/README.md does locally (`api alembic upgrade head`), just without Docker.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Migrate the test database to head
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.INGEST_TEST_DATABASE_URL }}
        run: |
          python -m pip install -r requirements.txt
          python -m alembic upgrade head

      # Apache Airflow is awkward to install on a bare runner (it needs a pinned constraints file and
      # many native wheels), so the tests run inside the project's own Airflow image, exactly like the
      # `airflow-tests` Compose service. That also keeps dbt available the way the DAGs see it.
      - uses: docker/setup-buildx-action@v4 # v4+ runs on Node 24

      - name: Build the project Airflow image
        uses: docker/build-push-action@v7 # v7+ runs on Node 24
        with:
          context: ./airflow
          load: true # make the image available to `docker run` below
          push: false
          tags: solnexus-airflow:ci
          # GitHub-hosted layer cache: the dbt install layer is unchanged on most PRs. mode=min stores
          # only the final image's layers; mode=max also saved every intermediate layer, took about a
          # minute per run and could push the npm and pip caches out of the repo's 10 GB Actions limit.
          cache-from: type=gha
          cache-to: type=gha,mode=min

      # Mirrors `docker compose --profile test run --rm airflow-tests`: the project is mounted
      # read-only, so pytest's cache is disabled instead of being written into it. The Gmail connector
      # tests use an in-memory fake and never call Google.
      # This stays a plain `docker run` rather than calling the Compose service because the container
      # must share the runner's network (--network host) to reach the job's Postgres service on
      # localhost; `docker compose run` would put it on the Compose project network instead.
      - name: Run Airflow tests
        run: |
          docker run --rm \
            --network host \
            --env SOLNEXUS_TEST_DATABASE_URL="$INGEST_TEST_DATABASE_URL" \
            --volume "$GITHUB_WORKSPACE/airflow:/opt/airflow/project:ro" \
            --workdir /opt/airflow/project \
            --env AIRFLOW__CORE__LOAD_EXAMPLES=false \
            --entrypoint bash \
            solnexus-airflow:ci \
            -c 'pip install --quiet --disable-pip-version-check -r requirements-dev.txt && python -m pytest -p no:cacheprovider'
